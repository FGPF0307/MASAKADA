<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F5F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MasakAda" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MasakAda</title>
    <script>
      // Pasang tema/mode sebelum halaman digambar supaya tidak berkedip terang → gelap. Logika lengkap: src/lib/tema.js.
      try {
        var d = document.documentElement, m = localStorage.getItem('masakada.mode')
        if (m === 'gelap' || (m === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches)) d.dataset.mode = 'gelap'
        if (localStorage.getItem('masakada.tema') === 'adonan') d.dataset.tema = 'adonan'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
